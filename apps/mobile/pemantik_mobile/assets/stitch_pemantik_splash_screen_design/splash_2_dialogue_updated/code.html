<style>
        .fade-in-up {
            animation: fadeInUp 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .fade-in-delayed {
            animation: fadeIn 2s ease-in-out 1s forwards;
            opacity: 0;
        }
        
        .pulse-slow {
             animation: pulseSlow 3s infinite ease-in-out;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
        
        @keyframes pulseSlow {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-white h-screen w-screen flex flex-col items-center justify-center overflow-hidden antialiased selection:bg-secondary-container selection:text-on-secondary-container">

<main class="flex flex-col items-center justify-center relative w-full max-w-md mx-auto p-margin-mobile">
<!-- Graphic Container -->

</div>

            #BerpihakKepadaAnak

</main>
<!-- Optional subtle background texture to prevent completely flat white -->
