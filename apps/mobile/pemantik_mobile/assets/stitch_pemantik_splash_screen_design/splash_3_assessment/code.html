<style>
        .animate-float-slow {
            animation: float 6s ease-in-out infinite;
        }
        .animate-float-medium {
            animation: float 4s ease-in-out infinite 1s;
        }
        .animate-float-fast {
            animation: float 3s ease-in-out infinite 0.5s;
        }
        .animate-pulse-glow {
            animation: pulse-glow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }
        
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 40px rgba(254, 214, 91, 0.5); }
        }

        .icon-merge-container {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .central-flame {
            position: absolute;
            width: 80px;
            height: 80px;
            background-color: theme('colors.secondary-container');
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.5s ease;
        }

        .orbit-icon {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background-color: theme('colors.surface');
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0px 4px 20px rgba(16, 46, 80, 0.15);
        }

        .orbit-1 {
            top: 10%;
            left: 10%;
        }

        .orbit-2 {
            bottom: 10%;
            right: 10%;
        }
    </style>
